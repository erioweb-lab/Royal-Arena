<script id="hud-layout-v1">

   CSS 생성 + JS 인라인 강제가 같은 CONFIG에서 나오므로 다른 곳(vNNN 블록·JS 초기화 인라인)을 고칠 필요 없음. */
(function(){

  tools:{ top:46, zoom:26, statusMinW:54, fs:10 },
  bottom:{ inset:12, h:34, fs:12, side:12, modesInset:106, modesGap:4, modesFs:10.5, narrowFs:9.5, narrowGap:3 }
};
window.RA_HUD=C;
var P='html body #app #screen-battle', B='blur('+C.blur+'px)';
function rgba(a){return 'rgba(18,24,43,'+a+')'}
var css=
 P+' .camera-modes{left:'+C.bottom.modesInset+'px!important;right:'+C.bottom.modesInset+'px!important;top:auto!important;bottom:calc('+C.bottom.inset+'px + env(safe-area-inset-bottom,0px))!important;transform:none!important;justify-content:center!important;align-items:center!important;gap:'+C.bottom.modesGap+'px!important}'+

 P+' #topbar{justify-content:flex-start!important;gap:4px!important}'+
 P+' .camera-modes button,'+P+' #ks-btn,'+P+' #btn-kingshot,'+P+' .kingshot-btn,'+P+' #repair-btn,'+P+' #btn-repair{height:'+C.bottom.h+'px!important;min-height:'+C.bottom.h+'px!important;max-height:'+C.bottom.h+'px!important;font-size:'+C.bottom.fs+'px!important;line-height:1!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:999px!important;white-space:nowrap!important;box-sizing:border-box!important}'+
 P+' .camera-modes button{flex:1 1 0!important;min-width:0!important;width:auto!important;padding:2px 4px!important;font-size:'+C.bottom.modesFs+'px!important;letter-spacing:-.3px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.5)!important;color:#ffe9b0!important;font-weight:700!important;box-shadow:0 2px 6px rgba(0,0,0,.35)!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' .camera-modes button[aria-pressed="true"]{background:rgba(255,179,0,'+C.alphaActive+')!important;border-color:rgba(255,224,130,.9)!important;color:#231a05!important;font-weight:800!important}'+
 P+' #ks-btn,'+P+' #btn-kingshot,'+P+' .kingshot-btn{left:'+C.bottom.side+'px!important;right:auto!important;bottom:calc('+C.bottom.inset+'px + env(safe-area-inset-bottom,0px))!important;padding:0 12px!important;background:linear-gradient(180deg,rgba(255,204,0,'+C.alphaActive+') 0%,rgba(255,157,0,'+C.alphaActive+') 100%)!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' #repair-btn,'+P+' #btn-repair{right:'+C.bottom.side+'px!important;left:auto!important;bottom:calc('+C.bottom.inset+'px + env(safe-area-inset-bottom,0px))!important;padding:0 12px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,179,0,.7)!important;color:#FFD54F!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' #camera-zoom-out,'+P+' #camera-zoom-in{flex:0 0 '+C.tools.zoom+'px!important;width:'+C.tools.zoom+'px!important;min-width:'+C.tools.zoom+'px!important;height:'+C.tools.zoom+'px!important;min-height:'+C.tools.zoom+'px!important;padding:0!important;font-size:15px!important;font-weight:800!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.5)!important;color:#ffe9b0!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' #camera-settings{height:'+C.tools.zoom+'px!important;min-height:'+C.tools.zoom+'px!important;padding:2px 8px!important;font-size:'+C.tools.fs+'px!important;font-weight:700!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.5)!important;color:#ffe9b0!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' #camera-status{height:'+C.tools.zoom+'px!important;min-height:'+C.tools.zoom+'px!important;min-width:'+C.tools.statusMinW+'px!important;max-width:62px!important;overflow:hidden!important;white-space:nowrap!important;text-overflow:ellipsis!important;justify-content:center!important;font-size:'+C.tools.fs+'px!important;font-weight:700!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.35)!important;color:#ffe9b0!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' #timer{display:flex!important;align-items:center!important;height:'+C.top.h+'px!important;padding:0 8px!important;font-size:'+C.top.fs+'px!important;letter-spacing:1px!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.5)!important;box-shadow:0 2px 6px rgba(0,0,0,.35)!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+';top:calc('+C.top.timerTop+'px + env(safe-area-inset-top,0px))!important;left:'+C.top.timerLeft+'px!important;right:auto!important}'+
 P+' .crown-chip{display:flex!important;align-items:center!important;justify-content:center!important;height:'+C.top.h+'px!important;min-width:'+C.top.chipMinW+'px!important;padding:0 7px!important;font-size:0!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.35)!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' .crown-chip span{font-size:'+C.top.chipFs+'px!important;font-family:var(--fd)!important}'+
 P+' #btn-sound{width:'+C.top.h+'px!important;height:'+C.top.h+'px!important;min-width:'+C.top.h+'px!important;font-size:13px!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.5)!important;color:#ffe9b0!important;top:calc('+C.top.timerTop+'px + env(safe-area-inset-top,0px))!important;right:'+C.top.soundRight+'px!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
 P+' #btn-quit{width:auto!important;height:'+C.top.h+'px!important;padding:0 8px!important;font-size:10.5px!important;font-weight:700!important;border-radius:999px!important;background:'+rgba(C.alpha)+'!important;border:1px solid rgba(255,215,110,.35)!important;color:#cdd7ea!important;top:calc('+C.top.timerTop+'px + env(safe-area-inset-top,0px))!important;right:'+C.top.quitRight+'px!important;backdrop-filter:'+B+';-webkit-backdrop-filter:'+B+'}'+
  P+' #topbar{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;width:100%!important;max-width:none!important;margin:0!important;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 0!important;background:none!important;border:none!important}'+

'@media (max-width:400px){'+P+' .camera-modes{gap:'+C.bottom.narrowGap+'px!important}'+P+' .camera-modes button{font-size:'+C.bottom.narrowFs+'px!important;padding:2px 2px!important;overflow:hidden}}';
var st=document.createElement('style'); st.id='hud-layout-generated'; st.textContent=css; document.head.appendChild(st);
/* 인라인 강제: 전투 초기화 JS가 인라인 !important로 덮어쓰는 요소(타이머·소리·기권·킹샷·수리)에 동일 CONFIG 값을 재적용 */
function F(id,props){var e=document.getElementById(id); if(!e)return; for(var k in props){e.style.setProperty(k,props[k],'important');}}
function force(){try{
 var TB=document.getElementById('topbar'), CT=document.querySelector('.camera-tools');
 if(TB&&CT&&CT.parentElement!==TB){ var __ref=document.getElementById('btn-sound'); TB.insertBefore(CT,__ref); }
 var __dp=document.getElementById('dpsw'); if(__dp) __dp.remove(); var __ds=document.getElementById('dpswst'); if(__ds) __ds.remove();
 var TOP='calc('+C.top.timerTop+'px + env(safe-area-inset-top,0px))';
 var BOT='calc('+C.bottom.inset+'px + env(safe-area-inset-bottom,0px))';
 F('timer',{position:'static',top:'auto',left:'auto',right:'auto',height:C.top.h+'px','line-height':'1',padding:'0 8px','font-size':C.top.fs+'px',background:rgba(C.alpha),border:'1px solid rgba(255,215,110,.5)','border-radius':'999px'});
 F('btn-sound',{position:'static',top:'auto',left:'auto',right:'auto',width:C.top.h+'px',height:C.top.h+'px','min-width':C.top.h+'px',padding:'0','font-size':'13px',background:rgba(C.alpha),border:'1px solid rgba(255,215,110,.5)','border-radius':'999px'});
 F('btn-quit',{position:'static',top:'auto',left:'auto',right:'auto',height:C.top.h+'px',padding:'0 8px','font-size':'10.5px',background:rgba(C.alpha),border:'1px solid rgba(255,215,110,.35)','border-radius':'999px'});
 F('ks-btn',{left:C.bottom.side+'px',right:'auto',bottom:BOT,height:C.bottom.h+'px',padding:'0 12px','font-size':C.bottom.fs+'px','border-radius':'999px'});
 if(!document.getElementById('ks-btn')){ var kk=document.getElementById('btn-kingshot')||document.querySelector('.kingshot-btn'); if(kk){F('btn-kingshot',{left:C.bottom.side+'px',right:'auto',bottom:BOT,height:C.bottom.h+'px',padding:'0 12px','border-radius':'999px'});} }
 F('repair-btn',{right:C.bottom.side+'px',left:'auto',bottom:BOT,height:C.bottom.h+'px',padding:'0 12px','font-size':C.bottom.fs+'px','border-radius':'999px'});
 if(!document.getElementById('repair-btn')){ var rr=document.getElementById('btn-repair'); if(rr){F('btn-repair',{right:C.bottom.side+'px',left:'auto',bottom:BOT,height:C.bottom.h+'px','border-radius':'999px'});} }
}catch(e){}}
force(); setInterval(force,900);
})();
</script>
